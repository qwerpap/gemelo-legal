<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Gemelo</title>
<style>
:root{--bg:#E9EFE3;--ink:#17231A;--soft:#51614F;--line:#B9C8B0;--acc:#A3461C;--panel:#F6F9F1;--warn:#FFF1D6}
@media (prefers-color-scheme:dark){:root{--bg:#0E1710;--ink:#E3ECDD;--soft:#97AA94;--line:#2A3B2C;--acc:#F0A06B;--panel:#152019;--warn:#2B2412}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif}
.wrap{max-width:780px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;flex-wrap:wrap;gap:6px}
.top b{font:700 14px/1 ui-monospace,Menlo,monospace;letter-spacing:.16em;text-transform:uppercase}
.top span{font:12px ui-monospace,Menlo,monospace;color:var(--soft)}
h1{font-size:34px;line-height:1.15;margin:.8em 0 .2em;font-weight:700}
h2{font:700 14px/1.2 ui-monospace,Menlo,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin:2em 0 .5em;border-top:1px solid var(--line);padding-top:14px}
h2 i{font-style:normal;color:var(--soft);margin-right:8px}
a{color:var(--acc)}
.box{background:var(--panel);border:1px solid var(--line);padding:12px 16px;border-radius:2px}
.warn{background:var(--warn);border-left:5px solid var(--acc);padding:12px 16px;margin:16px 0}
dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:6px 18px;margin:0}
dt{font:600 13px/1.5 ui-monospace,Menlo,monospace;color:var(--soft)}
dd{margin:0}
@media(max-width:560px){dl{grid-template-columns:1fr}dt{margin-top:8px}}
nav{margin-top:40px;font:13px ui-monospace,Menlo,monospace}
nav a{margin-right:16px}
</style></head><body>
<div class="wrap"><div class="top"><b>Gemelo</b><span>mushroom look-alike check</span></div><h1>Gemelo</h1><p>Photograph a wild mushroom from a few angles and see which toxic look-alikes it could be confused with.</p><p><a href="privacy.html">Privacy policy</a><br><a href="terms.html">Terms of use</a><br><a href="support.html">Support</a></p></div>
</body></html>
